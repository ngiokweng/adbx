[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adbx"
version = "0.1.0"
description = "Pull and push root-protected Android files and folders over ADB with fast checksum verification."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
adbx = "adbx.cli:main"

[tool.setuptools.packages.find]
include = ["adbx*"]
